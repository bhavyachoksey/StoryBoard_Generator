    /* History navbar: match main-page readability/glass contrast */
    body.tool-page .tool-nav {

      min-height: 2.15rem !important;

    body.tool-page .tool-nav a {

    body.tool-page .tool-nav a:hover {

<body class="tool-page">
  <a href="jcl_tools.html" class="tool-logo-link" aria-label="Go to Home">
    <img src="./jcl_tools/JCL Logo Horizontal.png" alt="JCL Tech Tools">
  </a>
  <nav class="tool-nav">
    <a href="jcl_tools.html">Home</a>
    <a href="StoryBoard.html">StoryBoard Generator</a>
    <span class="tool-nav-current">History</span>
  </nav>

  <main class="sb-container">
    <h1 class="sb-heading">Storyboard history</h1>
    <p class="sb-script-hint">
      Each time you generate a storyboard with a name, it is saved here. Click a storyboard title to reveal all its scene images.
    </p>

    <div id="sb-history-list" class="sb-history-list"></div>
    <div id="sb-history-empty" class="sb-empty-state" style="display:none;">
      No storyboard history yet. Generate a storyboard from the StoryBoard Generator page and give it a name to see it here.
    </div>
  </main>

  <div id="sb-history-modal" class="sb-modal-overlay" aria-hidden="true">
    <div class="sb-modal">
      <div id="sb-history-modal-img-wrap" class="sb-modal-img-wrap"></div>
      <button type="button" id="sb-history-modal-close" class="sb-modal-close">Close</button>
    </div>
  </div>

  <script>
    (function () {
      var historyList = document.getElementById("sb-history-list");
      var emptyState = document.getElementById("sb-history-empty");
      var modal = document.getElementById("sb-history-modal");
      var modalImgWrap = document.getElementById("sb-history-modal-img-wrap");
      var modalCloseBtn = document.getElementById("sb-history-modal-close");

      function escapeHtml(s) {
        var div = document.createElement("div");
        div.textContent = s || "";
        return div.innerHTML;
      }

      function formatDate(iso) {
        if (!iso) return "";
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return "";
          return d.toLocaleString();
        } catch (e) {
          return "";
        }
      }

      function openModal(src, title) {
        if (!modal || !modalImgWrap || !src) return;
        modalImgWrap.innerHTML = "";
        var img = document.createElement("img");
        img.src = src;
        img.alt = title || "";
        modalImgWrap.appendChild(img);
        modal.style.display = "flex";
        modal.setAttribute("aria-hidden", "false");
      }

      function closeModal() {
        if (!modal) return;
        modal.style.display = "none";
        modal.setAttribute("aria-hidden", "true");
      }

      function renderHistory(entries) {
        historyList.innerHTML = "";
        if (!entries || !entries.length) {
          emptyState.style.display = "block";
          return;
        }
        emptyState.style.display = "none";

        entries.forEach(function (entry, idx) {
          var item = document.createElement("div");
          item.className = "sb-history-item";

          var header = document.createElement("div");
          header.className = "sb-history-header";

          var titleWrap = document.createElement("div");
          var title = document.createElement("span");
          title.className = "sb-history-title";
          title.innerHTML = escapeHtml(entry.name || ("Storyboard " + (idx + 1)));
          titleWrap.appendChild(title);

          var metaText = [];
          if (entry.scenes && entry.scenes.length) {
            metaText.push(entry.scenes.length + " scenes");
          }
          var created = formatDate(entry.createdAt);
          if (created) {
            metaText.push(created);
          }
          if (metaText.length) {
            var meta = document.createElement("span");
            meta.className = "sb-history-meta";
            meta.textContent = metaText.join(" • ");
            titleWrap.appendChild(meta);
          }

          var toggle = document.createElement("span");
          toggle.className = "sb-history-toggle";
          toggle.textContent = "▾";

          header.appendChild(titleWrap);
          header.appendChild(toggle);

          var body = document.createElement("div");
          body.className = "sb-history-body";

          var grid = document.createElement("div");
          grid.className = "sb-scenes-grid";

          (entry.scenes || []).forEach(function (s) {
            var card = document.createElement("div");
            card.className = "sb-scene-card";

            var headerEl = document.createElement("div");
            headerEl.className = "sb-scene-card-header";
            headerEl.innerHTML = escapeHtml(s.title || ("Scene " + ((s.sceneIndex || 0) + 1)));

            var imgWrap = document.createElement("div");
            imgWrap.className = "sb-scene-card-img-wrap";
            var imgSrc = "";
            if (s.imageBase64) {
              imgSrc = "data:image/png;base64," + s.imageBase64;
            } else if (s.imagePath) {
              imgSrc = s.imagePath;
            }
            if (imgSrc) {
              var img = document.createElement("img");
              img.src = imgSrc;
              img.alt = s.title || "";
              imgWrap.appendChild(img);
              imgWrap.style.cursor = "pointer";
              imgWrap.setAttribute("role", "button");
              imgWrap.setAttribute("title", "Click to view larger");
              imgWrap.addEventListener("click", function () {
                openModal(imgSrc, s.title);
              });
            } else {
              var ph = document.createElement("div");
              ph.className = "sb-scene-card-placeholder";
              ph.textContent = "No image";
              imgWrap.appendChild(ph);
            }

            card.appendChild(headerEl);
            card.appendChild(imgWrap);
            grid.appendChild(card);
          });

          if (!entry.scenes || !entry.scenes.length) {
            var noScenes = document.createElement("div");
            noScenes.className = "sb-script-hint";
            noScenes.textContent = "No scenes were saved for this storyboard.";
            body.appendChild(noScenes);
          } else {
            body.appendChild(grid);
          }

          header.addEventListener("click", function () {
            var isOpen = item.classList.contains("is-open");
            var items = historyList.querySelectorAll(".sb-history-item.is-open");
            items.forEach(function (it) { it.classList.remove("is-open"); });
            if (!isOpen) {
              item.classList.add("is-open");
            }
          });

          item.appendChild(header);
          item.appendChild(body);
          historyList.appendChild(item);
        });
      }

      if (modalCloseBtn) {
        modalCloseBtn.addEventListener("click", closeModal);
      }
      if (modal) {
        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && modal.style.display === "flex") closeModal();
        });
      }

      fetch("/api/storyboard/history", { method: "GET" })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || r.statusText); });
          return r.json();
        })
        .then(function (data) {
          var entries = (data && data.entries) || [];
          entries.sort(function (a, b) {
            if (!a.createdAt && !b.createdAt) return 0;
            if (!a.createdAt) return 1;
            if (!b.createdAt) return -1;
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
          renderHistory(entries);
        })
        .catch(function () {
          emptyState.style.display = "block";
        });
    })();
  </script>
</body>
